name: build

# Every push and every pull request is built. A push to main (the merge of a pull request from
# develop) also makes a release when the newest version in CHANGELOG.md has no tag yet: the
# first heading of the form "## v1.2.3" names the version, and its section becomes the text of
# the release. A merge that does not add a version heading only builds.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # The branch rules of CONTRIBUTING.md, checked on every pull request: work reaches develop
  # from a branch named after the kind of change, main only takes develop, and the title of
  # the pull request has the form of a commit message.
  branch-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check the branches and the title
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|perf|refactor|docs|build|ci|chore'
          fail=0
          case "$BASE" in
            main)
              if [ "$HEAD" != "develop" ]; then
                echo "::error::main only takes pull requests from develop (this one comes from '$HEAD')."
                fail=1
              fi
              if ! printf '%s' "$TITLE" | grep -Eq '^release: v[0-9]+\.[0-9]+\.[0-9]+$|^('"$types"')(\([a-z0-9-]+\))?!?: .+'; then
                echo "::error::Title '$TITLE': use 'release: v1.2.3' or the form of a commit message, 'type(scope): summary'."
                fail=1
              fi
              ;;
            develop)
              # main may come back into develop after a release, so that the two stay level
              if [ "$HEAD" = "main" ]; then exit 0; fi
              if ! printf '%s' "$HEAD" | grep -Eq '^('"$types"')/[a-z0-9][a-z0-9._-]*$'; then
                echo "::error::Branch '$HEAD': name it after the kind of change, for example fix/round-counter or feat/pause-menu ($types)."
                fail=1
              fi
              if ! printf '%s' "$TITLE" | grep -Eq '^('"$types"')(\([a-z0-9-]+\))?!?: .+'; then
                echo "::error::Title '$TITLE': use the form of a commit message, 'type(scope): summary'."
                fail=1
              fi
              ;;
          esac
          exit $fail

  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.bat

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: bo2split
          path: |
            build/XINPUT1_3.dll
            bo2ss.ini

      - name: Version from the changelog
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## (v\d+\.\d+\.\d+)\s*$') { $start = $i; $tag = $Matches[1]; break }
          }
          if ($start -lt 0) { Write-Host 'CHANGELOG.md names no version: no release'; exit 0 }
          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## ') { $end = $i; break }
          }
          if (git ls-remote --tags origin "refs/tags/$tag") { Write-Host "$tag has a tag already: no release"; exit 0 }
          $notes = ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "release $tag"

      - name: Package release
        if: steps.version.outputs.tag != ''
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $dir = "bo2split-$tag"
          New-Item -ItemType Directory -Path $dir | Out-Null
          foreach ($f in 'build/XINPUT1_3.dll', 'bo2ss.ini', 'panel.ps1', 'panel.bat', 'README.md', 'CHANGELOG.md', 'LICENSE') {
            Copy-Item $f $dir
          }
          Copy-Item docs, img -Destination $dir -Recurse
          Compress-Archive -Path "$dir/*" -DestinationPath "$dir.zip"
          $dll = (Get-FileHash build/XINPUT1_3.dll -Algorithm SHA256).Hash.ToLower()
          $zip = (Get-FileHash "$dir.zip" -Algorithm SHA256).Hash.ToLower()
          Add-Content -Path release-notes.md -Encoding utf8 -Value @"

          ## Install

          1. Copy ``XINPUT1_3.dll`` and ``bo2ss.ini`` from the zip into the game folder, next to ``t6zm.exe``.
          2. Get the game's script update, once: start the game one time while Steam is online. A message tells when the file is saved. **Without it no match starts.**
          3. Put Steam into offline mode and start the game.

          The README in the zip has the details, and a download as a second way to get the script update.

          ## Checksums (SHA256)

          | File | SHA256 |
          |---|---|
          | ``XINPUT1_3.dll`` | ``$dll`` |
          | ``$dir.zip`` | ``$zip`` |
          "@

      - name: Create release
        if: steps.version.outputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ steps.version.outputs.tag }}' "bo2split-${{ steps.version.outputs.tag }}.zip" --target '${{ github.sha }}' --title '${{ steps.version.outputs.tag }}' --notes-file release-notes.md
