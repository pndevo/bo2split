; bo2split settings. Keep this file in the game folder next to XINPUT1_3.dll. Lines that start with
; a semicolon are comments. Most settings are read while the game runs, so a change shows within a
; moment; the few that are read only when the lobby opens or a match starts say so. A setting that is
; left out, or deleted, has its default, which is the value written here.
[bo2ss]

; ---- Start ----------------------------------------------------------------------------------

; Map, start location and game type of the match. The lobby opens with these; the map can also be
; changed in the lobby. Read when the lobby opens. A DLC map that you own and have installed is
; chosen here, the three settings have to fit together:
;   map=zm_transit   startlocation=transit   gametype=zclassic    TranZit, story mode
;   map=zm_transit   startlocation=town      gametype=zstandard   TranZit, Survival on Town
;   map=zm_transit   startlocation=farm      gametype=zstandard   TranZit, Survival on Farm
;   map=zm_transit   startlocation=diner     gametype=zstandard   TranZit, Survival on Diner
;   map=zm_transit   startlocation=busdepot  gametype=zstandard   TranZit, Survival on Bus Depot
;   map=zm_tomb      startlocation=tomb      gametype=zclassic    Origins
; Default: zm_transit, transit, zclassic.
map=zm_transit
startlocation=transit
gametype=zclassic

; The split-screen lobby opens by itself this many milliseconds after the game has started.
; 0 = it does not: click "Online" in the main menu. Default: 1000.
auto_menu_after_ms=1000

; The match starts by itself this many milliseconds after the lobby opened. 0 = the lobby stays
; open and you start the match there with "Start Match". A value above 0 starts a lobby that is
; already open as soon as that time has passed. Default: 0.
auto_start_after_ms=0

; 1 = players join in the lobby: press A on a gamepad that no player uses yet to join as the next
; player (2, 3 or 4), B on a joined pad to leave. Player 1 keeps the device set at p1_pad (by
; default the first connected gamepad). 0 = the player count and the pads below are used instead.
; Default: 1.
lobby_join=1

; ---- Players and devices --------------------------------------------------------------------

; The input device of each player: -2 = keyboard and mouse, -1 = nothing, 0 to 3 = that XInput pad
; (0 is the first pad). For player 1 also -3 = automatic: the first connected gamepad that no
; other player has, and keyboard and mouse when no gamepad is connected. While player 1 plays on
; a gamepad, keyboard and mouse do nothing in the match and still work in every menu (Escape
; opens the pause menu). Set p1_pad=-2 to play player 1 on keyboard and mouse with gamepads
; connected. A device belongs to one player: if two players name the same device, only the lower
; player gets it. Player 1 on a pad plays with the game's own gamepad bindings; players 2 to 4
; on a pad use the button layout below. Players 2 to 4 on keyboard and mouse have a fixed layout
; (see the README), and only one player can have the keyboard and mouse at a time.
; p1_pad is always used. p2_pad, p3_pad and p4_pad only matter when players do not join in the
; lobby (lobby_join=0). Defaults: -3, 1, 2, 3.
p1_pad=-3
p2_pad=1
p3_pad=2
p4_pad=3

; Players beyond the second: 0 = two players, 1 = three, 2 = four. Only matters when players do
; not join in the lobby (lobby_join=0). Read when the match starts. Default: 0.
extra_players=0

; ---- Screen ---------------------------------------------------------------------------------

; Split direction with two players: 1 = left and right, 0 = top and bottom. Three and four players
; always use quarters (see layout_three_players). Default: 1.
split_vertical=1

; Layout with three players: 1 = player 1 across the whole top half, players 2 and 3 in the
; bottom quarters. 0 = three quarters and the fourth one black. Choose it before the match
; starts; a change during a match leaves player 1's HUD at the old place. Default: 1.
layout_three_players=1

; Field of view of the split views, in percent of the game's own setting. 100 = as the game sets
; it, a smaller number gives a wider view; 50 = the vertical field of view of the full screen. It
; applies to halves and to the wide view of three players, not to quarters. Default: 70.
fov_scale=70

; ---- Look and aim ---------------------------------------------------------------------------

; Mouse speed of a player 2 to 4 on keyboard and mouse, in tenths of the game's "sensitivity"
; setting: 50 = 5.0. Default: 50.
mouse_sens=50

; Right stick of players 2 to 4: 1 = the turn speeds the game itself uses for a gamepad, the
; same as player 1 has (fast from the hip, slower while aiming, slower still with a zoomed
; weapon, with a short run-up). 0 = the fixed speed look_speed below. Default: 1.
look_native=1

; Run-up of the turn on a gamepad, for all players: 1 = as the game does it (the turn takes
; about a third of a second to reach full speed), 0 = full speed at once. Default: 1.
look_accel=1

; Right stick of players 2 to 4 with look_native=0: turn speed at full stick travel, in degrees
; per second. Higher = faster. Default: 180.
look_speed=180

; Part of the stick travel in percent that does nothing, so a stick at rest does not drift.
; Default: 20.
look_deadzone=20

; How the stick travel becomes turn speed, in percent: 100 = linear, 150 = finer around the
; centre with the same top speed, 200 = finer still. Default: 150.
look_curve=150

; Turn speed while aiming down the sights, in percent of the normal one. Applies to the mouse,
; and to the right stick with look_native=0. Default: 65.
look_ads_scale=65

; ---- Buttons of players 2 to 4 on a gamepad -------------------------------------------------

; One key per pad input; the value is the action the input does. All pads of players 2 to 4 share
; the layout. The actions:
;    0 none                    1 fire                     2 aim down sights
;    3 lethal grenade          4 tactical grenade         5 use / reload
;    6 jump (stands up first when crouched or prone)      7 crouch (tap) / prone (hold)
;    8 sprint                  9 melee                   10 next weapon
;   11 action slot 1          12 action slot 2           13 action slot 3
;   14 action slot 4          15 scoreboard (while held)
;   16 the player's own controller options               17 previous weapon
; Default: the numbers written here.

; Right trigger.
btn_rt=1
; Left trigger.
btn_lt=2
; Right bumper.
btn_rb=3
; Left bumper.
btn_lb=4
; X button.
btn_x=5
; A button.
btn_a=6
; B button.
btn_b=7
; Left stick click.
btn_ls=8
; Right stick click.
btn_rs=9
; Y button.
btn_y=10
; D-pad up.
btn_dpad_up=11
; D-pad down.
btn_dpad_down=12
; D-pad left.
btn_dpad_left=13
; D-pad right.
btn_dpad_right=14
; Back button. 15 shows the scoreboard in the player's own view while the button is held.
btn_back=15
; Start button. 16 pauses the match and opens the menus (see player_menu).
btn_start=16

; While the match is paused every player 2 to 4 has the game's controller options in its own
; view: look inversion, stick layout, button layout and look sensitivity. Start on any gamepad
; (or Escape) pauses and opens the menus, player 1 gets the pause menu; Start again closes them
; all. D-pad or left stick moves, A selects, B closes the player's own menu. The choices are kept
; per player in bo2ss_players.ini in the game folder.
; 0 = off: only player 1's pause menu opens.
; Default: 1.
player_menu=1

; Player 1's pause menu is drawn inside player 1's view, as the menus of the other players are
; inside theirs.
; 0 = in the middle of the whole screen, across the views.
; Default: 1.
pause_menu_in_view=1

; Holding the Back button on the gamepad of a player 2 to 4 shows the scoreboard inside that
; player's own view. 0 = off.
; Default: 1.
player_scores=1

; The gamepads of players 2 to 4 vibrate as player 1's does (shots, hits, explosions). Each
; player can turn it off for itself with "Gamepad vibration" in its controller options.
; 0 = off for all of them.
; Default: 1.
player_rumble=1

; How long the crouch button is held, in milliseconds, to go prone (or to stand up from prone).
; Default: 300.
stance_hold_ms=300

; ---- Log ------------------------------------------------------------------------------------

; 0 = bo2ss.log in the game folder stays short. 1 = it also records the game's console output, the
; menu events and the state of the menus; switch it on when a bug report needs it (the file gets
; large). Default: 0.
trace=0
